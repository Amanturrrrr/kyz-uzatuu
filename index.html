<style id="lux">

/* ===== анимации при прокрутке ===== */
@keyframes imgIn{from{opacity:0;transform:scale(1.1)}}

.hn{filter:drop-shadow(0 2px 2px rgba(150,120,60,.28));animation:drift 8s ease-in-out infinite}
.rv,.rv.in{opacity:1;transform:none;transition:none}
.rv>*,.rv .card>:not(.cn){opacity:0;transform:translateY(16px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in>*,.rv.in .card>:not(.cn){opacity:1;transform:none}
.rv>.btn{transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),background .25s,color .25s}
.rv.in>:nth-child(2){transition-delay:0.12s}.rv.in>:nth-child(3){transition-delay:0.24s}.rv.in>:nth-child(4){transition-delay:0.36s}.rv.in>:nth-child(5){transition-delay:0.48s}.rv.in>:nth-child(6){transition-delay:0.60s}.rv.in>:nth-child(7){transition-delay:0.72s}.rv.in .card>:nth-child(5){transition-delay:0.08s}.rv.in .card>:nth-child(6){transition-delay:0.16s}.rv.in .card>:nth-child(7){transition-delay:0.24s}.rv.in .card>:nth-child(8){transition-delay:0.32s}.rv.in .card>:nth-child(9){transition-delay:0.40s}.rv.in .card>:nth-child(10){transition-delay:0.48s}.rv.in .card>:nth-child(11){transition-delay:0.56s}.rv.in .card>:nth-child(12){transition-delay:0.64s}

.rv.in .cn,.wish.in .cn,.fin.in .cn{opacity:1}
.tphoto img{opacity:0;transform:scale(1.08);transition:opacity 1.5s ease,transform 2s ease}
.tphoto.in img{opacity:1;transform:none}
body.reveal .bride img{animation:imgIn 1.8s ease .25s both}
.nojs .rv>*,.nojs .rv .card>:not(.cn),.nojs .cn,.nojs .tphoto img{opacity:1;transform:none}

var L = "ky", errKey = "";
try { var sv = localStorage.getItem("lang"); if (sv === "ru" || sv === "ky") L = sv; } catch(e){}

function applyLang(){
  var t = D[L];
  document.documentElement.lang = L;
  document.title = t.title;
  document.querySelectorAll("[data-i]").forEach(function(el){ el.innerHTML = t[el.getAttribute("data-i")]; });
  document.querySelectorAll("[data-ph]").forEach(function(el){ el.placeholder = t[el.getAttribute("data-ph")]; });
  document.querySelectorAll("[data-al]").forEach(function(el){ el.setAttribute("aria-label", t[el.getAttribute("data-al")]); });
  document.querySelectorAll("#lang button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-l") === L ? "true" : "false"); });
  document.getElementById("err").textContent = errKey ? t[errKey] : "";
}
document.getElementById("lang").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  L = b.getAttribute("data-l");
  try { localStorage.setItem("lang", L); } catch(err){}
  applyLang();
});

// ===== Музыка: один <audio>, плавный старт и остановка =====
function createMusic(){
  var bgm = document.getElementById("bgm"), btn = document.getElementById("mus");
  var want = false, raf = 0, loaded = false, wasPlaying = false;
  function ui(on){ btn.classList.toggle("playing", on); btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  function fade(to, ms, cb){
    cancelAnimationFrame(raf);
    var from = bgm.volume, t0 = performance.now();
    (function step(now){
      var k = Math.min(1, (now - t0) / ms);
      bgm.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k < 1) raf = requestAnimationFrame(step); else if (cb) cb();
    })(t0);
  }
  function start(){
    if (want) return;                       // уже играет: второй поток не создаётся
    want = true; ui(true);
    if (!loaded){ bgm.src = AUDIO_SRC; loaded = true; }
    bgm.volume = 0;
    var pr = bgm.play();
    if (pr && pr.catch) pr.catch(function(){ want = false; ui(false); });
    fade(VOLUME, FADE_IN);
  }
  function stop(){
    if (!want) return;
    want = false; ui(false);
    fade(0, FADE_OUT, function(){ if (!want) bgm.pause(); });
  }
  bgm.addEventListener("error", function(){ want = false; ui(false); });
  btn.addEventListener("click", function(e){ e.stopPropagation(); want ? stop() : start(); });
  document.addEventListener("visibilitychange", function(){
    if (document.hidden){ wasPlaying = want; if (want){ want = false; cancelAnimationFrame(raf); bgm.pause(); } }
    else if (wasPlaying){ wasPlaying = false; start(); }
  });
  return {start:start, stop:stop};
}

// ===== Конверт: открытие =====
(function(){
  var it = document.getElementById("intro"), b = document.body, h = document.documentElement, opened = false;
  var m = createMusic();
  h.classList.add("locked"); b.classList.add("pre");
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.scrollTo(0, 0);
  it.addEventListener("touchmove", function(e){ if(!opened) e.preventDefault(); }, {passive:false});
  function open(){
    if (opened) return; opened = true;
    if (AUTOPLAY_ON_OPEN) m.start();
    it.classList.add("open");
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var img = it.classList.contains("has-img");
    setTimeout(function(){ b.classList.add("reveal"); b.classList.remove("pre"); }, reduce ? 0 : (img ? 250 : 1300));
    setTimeout(function(){
      it.parentNode && it.parentNode.removeChild(it);
      h.classList.remove("locked");
      window.scrollTo(0, 0);
    }, reduce ? 50 : (img ? 1200 : 2250));
  }
  it.addEventListener("click", open);
  it.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
})();

// ===== Плавное появление блоков =====
(function(){
  var els = document.querySelectorAll(".rv,.tphoto,.fin,.wish");
  if (!("IntersectionObserver" in window)){ document.documentElement.classList.add("nojs"); return; }
  var io = new IntersectionObserver(function(en){
    en.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, {threshold:.15});
  els.forEach(function(e){ io.observe(e); });
})();

// ===== Таймер =====
var T = new Date("2026-11-18T16:00:00+06:00").getTime();
function p(x){return String(x).padStart(2,"0")}
function set(id, v){ var el = document.getElementById(id); if (el.textContent !== v){ el.textContent = v; el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip"); } }
function tick(){
  var l = Math.max(0, T - Date.now()), s = Math.floor(l/1000);
  set("d", p(Math.floor(s/86400))); set("h", p(Math.floor(s%86400/3600)));
  set("m", p(Math.floor(s%3600/60))); set("s", p(s%60));
}
tick(); setInterval(tick, 1000);
